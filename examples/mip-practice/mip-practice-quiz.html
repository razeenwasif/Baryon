const questions=[{"body": "<p>Use the 3-SAT formulation below. Select the option with the <strong>minimum</strong> set of constraints that correctly models the problem.</p>", "images": [0], "choices": ["2 and 4", "1, 2, 3 and 4", "1 and 3", "2, 3 and 4", "1"]}, {"body": "<p>Explain your answer to question 1 by either:</p><ul><li>explaining why the unselected constraints are NOT needed, or</li><li>explaining why all constraints (1, 2, 3 and 4) are needed.</li></ul>"}, {"body": "<p>Using the 3-SAT problem from Question 1 as an example, explain why computing the convex hull of an ILP can be computationally expensive.</p>", "limit": 100}, {"body": "<p>After the first MIP lecture, two students argue about the constraints needed to model <span class=\"math\">y = max(x₁, x₂, …, xₙ)</span>. Here is the relevant slide and Student A’s claim.</p>", "images": [1, 2], "choices": ["No", "Yes"]}, {"body": "<p>Explain your answer to question 4 for Student A’s claim. Use <code>under(xj)</code> to represent the lower bound and <code>over(xj)</code> to represent the upper bound of xj.</p>"}, {"body": "<p>(Continuation of question 4.) Student B claims that we can remove the <strong>− under(xj)</strong> term from the big-M coefficient, replacing <span class=\"math\">maxᵢ(over(xi)) − under(xj)</span> with <span class=\"math\">maxᵢ(over(xi))</span>. Is this correct?</p>", "choices": ["No", "Yes"]}, {"body": "<p>Explain your answer to question 6 for Student B’s claim. Use <code>under(xj)</code> to represent the lower bound and <code>over(xj)</code> to represent the upper bound of xj.</p>"}, {"body": "<p>What is the main role of the feasibility pump in the Branch and Bound algorithm?</p>", "choices": ["It helps in dividing the problem into smaller feasible subproblems", "It relaxes the integer constraints of the problem preserving the original feasible solutions", "It is used to find feasible solutions that may not necessarily be optimal", "It is used to calculate the optimal solution for each feasible subproblem", "It is used to ensure that no feasible solution violates the problem’s original constraints"]}, {"body": "<p>Explain your answer to question 8.</p>", "limit": 100}, {"body": "<p>When using Branch and Bound to solve a minimization ILP, why is the optimality gap for the original ILP defined using the smallest lower bound over all open nodes?</p>", "limit": 100}, {"body": "<p>If we have the convex hull of the ILP feasible points, can Gomory cuts still be used to speed up finding the optimal solution of the ILP?</p>", "choices": ["No", "Yes"]}, {"body": "<p>Explain your answer to question 11.</p>", "limit": 50}, {"body": "<p>Benders decomposition: let x be in [0, 4] and define the continuous recourse problem Q(x) = min 2y subject to y &ge; 3 &minus; x and y &ge; 0. The master variable theta estimates Q(x).</p><p>At x = 1, the optimal dual multiplier for y &ge; 3 &minus; x is 2. Which Benders optimality cut follows?</p>", "choices": ["theta >= 3 - x", "theta >= 6 - 2x", "theta <= 6 - 2x", "x >= 3"]}, {"body": "<p>Explain why the cut in question 13 is a valid lower bound on Q(x) for every x in [0, 4], including x greater than 3.</p>", "limit": 80}, {"body": "<p>Modify the recourse problem in question 13 by adding y &le; 1. At the master candidate x = 1, the subproblem is infeasible.</p><p>Is x &ge; 2 a valid Benders feasibility cut that excludes all and only the infeasible x values in [0, 4] for this modified subproblem?</p>", "choices": ["Yes", "No"]}, {"body": "<p>True or false: the single optimality cut selected in question 13, without any other bound on theta, exactly represents Q(x) throughout [0, 4].</p>", "choices": ["True", "False"]}, {"body": "<p>Column generation for the minimization LP min c^T lambda subject to A lambda = b and lambda &ge; 0: the current restricted-master dual vector is pi = (2, 1).</p><p>A missing column has a = (1, 3) and cost c = 4. What is its reduced cost c &minus; pi^T a?</p>", "choices": ["1", "-1", "4", "9"]}, {"body": "<p>Explain what the reduced cost in question 17 tells us about this column and the current restricted-master dual solution. Does adding it guarantee an immediate strict decrease in the primal objective, even with degeneracy?</p>", "limit": 80}, {"body": "<p>Consider a feasible restricted master solved to optimality for a minimization LP with nonnegative variables and equality constraints. Exact pricing proves that every omitted column has nonnegative reduced cost at the current dual solution.</p><p>True or false: this proves optimality of the full LP relaxation and also automatically proves optimality of the corresponding integer program.</p>", "choices": ["True", "False"]}, {"body": "<p>In column generation for a continuous minimization master, exact pricing finds no negative reduced-cost column and the feasible restricted master has objective value 12. Its current solution is fractional.</p><p>Which conclusion is guaranteed about the corresponding minimization integer program, if its feasible set is nonempty?</p>", "choices": ["Its optimal value is exactly 12", "Its optimal value is at most 12", "Its optimal value is at least 12", "It has no finite optimum"]}, {"body": "<p>Convex optimization: minimize f(x, y) = x^2 + y^2 over real x and y subject to x + y &ge; 2. Which point is the unique global minimizer?</p>", "choices": ["(0, 0)", "(1, 1)", "(2, 0)", "The problem is unbounded below"]}, {"body": "<p>Use the KKT conditions to justify the answer to question 21. Write the constraint as 2 &minus; x &minus; y &le; 0, give its nonnegative multiplier, and explain why these conditions certify a global minimum.</p>", "limit": 80}, {"body": "<p>True or false: for a convex objective minimized over a convex feasible set, every local minimizer is also a global minimizer.</p>", "choices": ["True", "False"]}, {"body": "<p>The graph below defines a smooth function on the displayed interval. Is the illustrated function convex on that interval?</p><svg id=\"convex-grap
