name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies safely (ignore postinstall scripts)
        run: npm ci --ignore-scripts

      - name: Syntax check desktop runtime entrypoints
        run: node --check desktop/main.cjs desktop/preload.cjs

      - name: Run repository security invariant checks
        run: node --test test/repo-security.test.mjs

      - name: Build renderer bundle
        run: npm run build
